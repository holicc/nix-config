# mihomo 基础配置：只放"我们自己的"设置，不含任何订阅、节点或密钥，可以放心提交到公开仓库。
#
# 最终配置 = 本文件 + 订阅里的 proxies / proxy-groups / rules（以及 proxy-providers / rule-providers）。
# `nx proxy init` 和 `nx proxy update` 会下载你的订阅，只取上述几段，拼在本文件后面，
# 写到 ~/.config/mihomo/config.yaml（权限 600）。订阅里的端口、DNS、TUN 等其余设置会被丢弃，
# 统一以本文件为准，所以订阅服务商怎么改都不会影响本机的监听端口和 TUN 行为。
# **不要把生成的 config.yaml 提交到 git，它包含你的节点密码。**
#
# 文档：https://wiki.metacubex.one/

# 本机代理端口（HTTP + SOCKS5 混合）。TUN 开启（默认）时所有程序自动走代理，不用设置；
# TUN 关闭时，程序要自己配置 https_proxy=http://127.0.0.1:7890 才会走代理
mixed-port: 7890
allow-lan: false          # 不对局域网开放，只给本机用
mode: rule
log-level: info
ipv6: false
unified-delay: true
tcp-concurrent: true

# 本地 API，仅监听本机，没有网页界面；`nx proxy nodes|use|tun` 通过它工作。
# 同机的任何程序都能调用它，所以不要对局域网开放
external-controller: 127.0.0.1:9090

# 记住你用 `nx proxy use` 选的节点，重启后保持（保存在 mihomo 的状态目录里）
profile:
  store-selected: true

# 订阅规则里的 GEOIP,CN 需要地理数据库，mihomo 启动时会下载。
# 默认地址在 GitHub，这台机器访问很慢，所以换成 jsdelivr 镜像（实测可用，约 1MB/s）
geo-auto-update: false
geox-url:
  mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.metadb"
  geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  asn: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"

# 透明代理（TUN）：默认开启，mihomo 一启动就是全局代理（含 nix-daemon、git 等），不用逐个设置代理变量；
# 想临时关掉用 `nx proxy tun off`（再开 `nx proxy tun on`）。mihomo 本身不随开机启动，
# 用 `nx proxy off` 停掉就完全不走代理。
# 实测：开启 TUN、用 Hysteria2 节点，不设任何代理变量连续 8 次访问 GitHub 全部成功，
# 没有 mihomo 自己的 UDP 被路由回 TUN 的旁路回环（auto-detect-interface: true 起了作用）。
# 在这台机器上排查出两个问题，都已处理并实测验证，都在 modules/nixos/mihomo.nix 里：
#   1. DNS 失效：NixOS 防火墙的严格反向路径过滤丢掉 TUN 回包，
#      处理：networking.firewall.checkReversePath = "loose"
#   2. DNS 好了但 HTTPS 连不上：mixed / system 栈在 TUN 地址上开 TCP 监听，防火墙不放行从 Meta
#      网卡进来的新连接，TCP 被丢弃；处理：networking.firewall.trustedInterfaces = [ "Meta" ]
#      （实测：国内镜像直连约 0.3 秒，GitHub 走代理约 50KB/s）
# 出问题时 `nx proxy tun off`；或 `nx proxy off` 整个停掉
tun:
  enable: true
  # 网卡名固定为 Meta：modules/nixos/mihomo.nix 里的防火墙 trustedInterfaces 按这个名字放行
  device: Meta
  # mixed（TCP 走系统栈，UDP 走用户态）比 gvisor 省 CPU，已实测可用（system 也可用）。
  # 它要求防火墙放行 Meta 网卡（modules/nixos/mihomo.nix 的 trustedInterfaces），否则 TCP 连不上；
  # 如果以后防火墙设置有变动导致 TCP 不通，临时改成 gvisor 可以绕开（用户态栈不经过本机输入链）
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  dns-hijack:
    - any:53

# DNS：参考 Mac 上 FlClash 的设置（respect-rules、default-nameserver、proxy-server-nameserver）。
# 开启 TUN 后，系统的 DNS 查询会被 mihomo 接管，返回 198.18.x.x 的 fake-ip，再按域名走规则
dns:
  enable: true
  ipv6: false
  respect-rules: true
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - dns.msftnsci.com
    - www.msftnsci.com
    - www.msftconnecttest.com
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - 223.5.5.5
    - 119.29.29.29
  proxy-server-nameserver:
    - 223.5.5.5
    - 119.29.29.29

# ---- 以下由 nx proxy init/update 从订阅追加：proxies、proxy-groups、rules ----
